<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --ink:#e8ecf1; --dim:#93a0b0; --bg:#0e1116; --panel:#171c24; --line:#262d38;
          --tray:#f2a33c; --video:#6fb2e8; --ok:#5aa87a; --warn:#e0693f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 "Inter","Helvetica Neue",Arial,sans-serif; }
  .wrap { max-width:1680px; margin:0 auto; padding:24px 22px 80px; }
  h1 { font-size:23px; font-weight:600; margin:0 0 3px; }
  h2 { font-size:15px; font-weight:600; margin:26px 0 12px; }
  .sub { color:var(--dim); margin:0 0 16px; }
  a { color:var(--tray); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .back { display:inline-block; margin-bottom:12px; font-size:13px; color:var(--dim); }
  .meta { display:flex; flex-wrap:wrap; gap:10px 26px; padding:14px 0 16px;
          border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .meta div { font-size:13px; color:var(--dim); }
  .meta b { display:block; color:var(--ink); font-weight:500;
            font-variant-numeric:tabular-nums; }
  .tabs { display:flex; gap:4px; margin:18px 0; flex-wrap:wrap; }
  .tabs button { background:none; border:1px solid var(--line); color:var(--dim);
                 padding:8px 17px; border-radius:999px; cursor:pointer; font:inherit;
                 font-size:14px; }
  .tabs button[aria-selected="true"] { background:var(--ink); color:var(--bg);
                                       border-color:var(--ink); }
  .bar { display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:12px 0;
         border-top:1px solid var(--line); border-bottom:1px solid var(--line);
         margin-bottom:16px; }
  .bar label { font-size:13px; color:var(--dim); }
  .bar b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .bar input[type=range] { width:180px; accent-color:var(--tray); }
  .spacer { flex:1; }
  button.act { background:var(--panel); border:1px solid var(--line); color:var(--ink);
               padding:8px 15px; border-radius:6px; font:inherit; font-size:14px;
               cursor:pointer; }
  button.act:hover { border-color:var(--tray); }
  button.act.primary { background:var(--tray); color:#141414; border-color:var(--tray); }
  button.act:disabled { opacity:.45; cursor:default; }
  .stat { font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .stat b { color:var(--ink); font-weight:500; }
  .grid { display:grid; gap:14px; }
  .cols-5 { grid-template-columns:repeat(5,minmax(0,1fr)); }
  .cols-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .cols-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .cols-4 { grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
  @media (min-width:1500px) { .cols-4 { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .cols-8 { grid-template-columns:repeat(8,minmax(0,1fr)); gap:7px; }
  .lower { align-items:start; margin-top:4px; }
  .lower figure.half { max-width:100%; }
  .threequarter figure { max-width:75%; }
  @media (max-width:1100px) { .threequarter figure { max-width:100%; } }
  .cols-8 figcaption { padding:5px 7px; font-size:11px; }
  @media (max-width:1500px) { .cols-8 { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .wipe { position:absolute; inset:0; overflow:hidden; width:50%; }
  .wipe img { position:absolute; top:0; left:0; max-width:none; }
  .divider { position:absolute; top:0; bottom:0; width:2px; background:var(--tray);
             pointer-events:none; }
  table.points { width:auto; border-collapse:collapse; font-size:13px; margin-top:8px;
                 font-variant-numeric:tabular-nums; }
  table.points th, table.points td { text-align:left; padding:4px 14px 4px 0;
                                     border-bottom:1px solid var(--line); }
  table.points th { color:var(--dim); font-weight:500; }
  @media (max-width:1300px) { .cols-5 { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width:900px) { .cols-5,.cols-3,.cols-2 { grid-template-columns:1fr; } }
  figure { margin:0; background:var(--panel); border:1px solid var(--line);
           border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
  figure.picked { border-color:var(--ok); box-shadow:0 0 0 1px var(--ok) inset; }
  figcaption { padding:9px 12px; font-size:12px; color:var(--dim); flex:1; }
  figcaption b { color:var(--ink); font-weight:600; }
  .stage { position:relative; line-height:0; background:#0b0d11; }
  .stage img, .stage canvas { width:100%; display:block; }
  .stage svg { position:absolute; inset:0; width:100%; height:100%; }
  .stage polygon { fill:none; stroke:var(--tray); stroke-width:2.5;
                   vector-effect:non-scaling-stroke; }
  .stage polygon.video { stroke:var(--video); }
  .stage polygon.derived { stroke:rgba(242,163,60,.55); stroke-width:2;
                           stroke-dasharray:8 6; }
  .crosshair-h, .crosshair-v { position:absolute; background:rgba(255,255,255,.85);
                               pointer-events:none; }
  .crosshair-h { left:0; right:0; top:50%; height:1px; margin-top:-0.5px; }
  .crosshair-v { top:0; bottom:0; left:50%; width:1px; margin-left:-0.5px; }
  .loupe { position:absolute; width:140px; height:140px; border-radius:50%;
           border:2px solid var(--tray); background-repeat:no-repeat;
           pointer-events:none; display:none; box-shadow:0 4px 18px rgba(0,0,0,.6);
           image-rendering:pixelated; z-index:5; }
  .bar select { background:var(--panel); border:1px solid var(--line); color:var(--ink);
                padding:7px 10px; border-radius:6px; font:inherit; font-size:13px; }
  .stage .handle { fill:var(--tray); stroke:#141414; stroke-width:1.5; cursor:grab; }
  .readout { position:absolute; left:8px; bottom:8px; background:rgba(6,9,13,.85);
             padding:3px 8px; border-radius:4px; font-size:12px; color:var(--ink);
             font-variant-numeric:tabular-nums; pointer-events:none; opacity:0;
             transition:opacity .12s; }
  .stage:hover .readout { opacity:1; }
  .pick { border:none; border-top:1px solid var(--line); background:none;
          color:var(--ink); padding:8px; font:inherit; font-size:13px; cursor:pointer; }
  .pick:hover { background:var(--ink); color:var(--bg); }
  figure.picked .pick { color:var(--ok); }
  .trial { margin-bottom:26px; }
  .trial h3 { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; font-size:15px;
              border-bottom:1px solid var(--line); padding-bottom:8px; margin:0 0 10px; }
  .trial h3 span { font-weight:400; font-size:13px; color:var(--dim);
                   font-variant-numeric:tabular-nums; }
  .note { background:rgba(224,105,63,.1); border:1px solid rgba(224,105,63,.35);
          color:#f0c3ae; padding:10px 13px; border-radius:7px; font-size:13px;
          margin:0 0 14px; }
  .msg { padding:10px 13px; border-radius:7px; font-size:13px; margin:12px 0 0; }
  .msg.ok { background:rgba(90,168,122,.12); border:1px solid rgba(90,168,122,.4);
            color:#bfe3cd; }
  .msg.bad { background:rgba(224,105,63,.12); border:1px solid rgba(224,105,63,.4);
             color:#f0c3ae; }
  .foot { margin-top:40px; padding-top:14px; border-top:1px solid var(--line);
          color:var(--dim); font-size:12px; }
  .swap { display:flex; gap:10px; align-items:center; }
  .block { margin-bottom:24px; }
  .matrix { display:grid; gap:6px; align-items:start; }
  .matrix .colhead { font-size:12px; color:var(--dim); padding:0 0 4px;
                     font-variant-numeric:tabular-nums; }
  .matrix .colhead b { display:block; color:var(--ink); font-weight:600; font-size:13px; }
  .rowlab { font-size:12px; color:var(--ink); padding:4px 8px 0 0; }
  .rowlab b { display:block; font-weight:600; }
  .rowlab span { color:var(--dim); font-size:11px; }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:5px;
          overflow:hidden; }
  .cellnote { padding:14px 8px; font-size:11px; color:var(--dim); text-align:center; }
  .cellfoot { padding:3px 6px; font-size:10px; color:var(--dim);
              border-top:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .blank { }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">All projects</a>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="meta" id="meta"></div>
  <div class="bar">
    <a class="back" href="prep" style="margin:0">Prep</a>
    <a class="back" href="depth" style="margin:0">Depth</a>
    <a class="back" href="summary" style="margin:0">Summary</a>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="bar" id="controls"></div>
  <p class="sub">One column per day, eight to a block, each map showing everything up
     to and including that day. Counts under each cell are in the order the colours
     are listed.</p>
  <div id="body"></div>
  <p class="foot" id="foot"></p>
</div>
<script src="common.js"></script>
<script src="stats.js"></script>
<script src="clusters.js"></script>
</body>
</html>
