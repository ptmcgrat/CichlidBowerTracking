<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__ANALYSIS__</title>
<style>
  :root { --ink:#e8ecf1; --dim:#93a0b0; --bg:#0e1116; --panel:#171c24; --line:#262d38;
          --tray:#f2a33c; --ok:#5aa87a; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 "Inter","Helvetica Neue",Arial,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:28px 24px 72px; }
  h1 { font-size:23px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--dim); margin:0 0 20px; }
  a { color:var(--tray); text-decoration:none; }
  a:hover { text-decoration:underline; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:13px; }
  td:last-child { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>__ANALYSIS__</h1>
  <p class="sub">__DONE__ of __COUNT__ projects have a registration and crops. Prep
     sets the trial times, registration, crops and the residual filter; everything
     downstream reads what you save there.</p>
  <table>
    <tr><th>project</th><th>category</th><th>tank</th><th>collected</th>
        <th>registered</th><th>cropped</th><th>last saved</th></tr>
    __ROWS__
  </table>
</div>
</body>
</html>
