<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__ANALYSIS__</title>
<style>
  :root { --ink:#e8ecf1; --dim:#93a0b0; --bg:#0e1116; --panel:#171c24; --line:#262d38;
          --tray:#f2a33c; --ok:#5aa87a; --warn:#e0693f; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 "Inter","Helvetica Neue",Arial,sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:28px 24px 72px; }
  td.cats { line-height:1.9; }
  .chip { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px;
          border:1px solid var(--line); color:var(--dim); margin-right:3px;
          font-variant-numeric:tabular-nums; }
  h1 { font-size:23px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--dim); margin:0 0 20px; }
  a { color:var(--tray); text-decoration:none; }
  a:hover { text-decoration:underline; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:13px; }
  td:last-child { color:var(--dim); font-size:12px; }
  /* alternating bands by category: the group's edge is visible without a
     heading row breaking the columns */
  tr.band0 td { background:rgba(255,255,255,.022); }
  tr.band1 td { background:transparent; }
  tr:hover td { background:rgba(242,163,60,.07); }
  a.name { font-weight:500; }
  td.links { white-space:nowrap; }
  a.tab { display:inline-block; color:var(--dim); font-size:12px; padding:2px 7px;
          border:1px solid var(--line); border-radius:4px; margin-right:3px; }
  a.tab:hover { color:var(--ink); border-color:var(--tray); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Analyses</h1>
  <p class="sub">__COUNT__ analyses in this working directory. Each is a set of
     projects reviewed together; pick one to see its projects.</p>
  <table>
    <tr><th>analysis</th><th>projects</th><th>collected</th><th>prepped</th>
        <th>categories</th><th>last saved</th></tr>
    __ROWS__
  </table>
</div>
</body>
</html>
